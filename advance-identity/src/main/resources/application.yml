spring:
  application:
    name: advance-identity
  datasource:
    url: jdbc:postgresql://localhost:5432/advance_identity
    username: advance_user
    password: advance_pass
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: http://localhost:8180/realms/advance/protocol/openid-connect/certs
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
