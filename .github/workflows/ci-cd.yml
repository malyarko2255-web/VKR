name: CI/CD

on:
  push:
    branches: [main, master, "claude/*"]
  pull_request:
    branches: [main, master]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/finuniversity

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: temurin
          cache: maven

      - name: Run tests
        run: mvn test -pl advance-common,advance-core,advance-gateway,advance-identity,advance-payment,advance-scoring,advance-reference,advance-notification -am

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: "**/target/surefire-reports/*.xml"

  build-and-push:
    name: Build & Push (${{ matrix.service }})
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - service: advance-gateway
            port: 8080
          - service: advance-identity
            port: 8082
          - service: advance-core
            port: 8081
          - service: advance-payment
            port: 8083
          - service: advance-scoring
            port: 8084
          - service: advance-reference
            port: 8085
          - service: advance-notification
            port: 8086
          - service: advance-frontend
            port: 80
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: "v1.29.0"

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBECONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Deploy namespace and config
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl apply -f k8s/configmap.yaml

      - name: Deploy infrastructure
        run: kubectl apply -f k8s/infra/

      - name: Wait for infrastructure
        run: |
          kubectl rollout status statefulset/advance-postgres -n advance-system --timeout=120s
          kubectl rollout status statefulset/advance-redis -n advance-system --timeout=120s
          kubectl rollout status statefulset/advance-kafka -n advance-system --timeout=180s

      - name: Update images
        run: |
          SHA=${{ github.sha }}
          kubectl set image deployment/advance-gateway advance-gateway=${{ env.IMAGE_PREFIX }}/advance-gateway:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-identity advance-identity=${{ env.IMAGE_PREFIX }}/advance-identity:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-core advance-core=${{ env.IMAGE_PREFIX }}/advance-core:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-payment advance-payment=${{ env.IMAGE_PREFIX }}/advance-payment:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-scoring advance-scoring=${{ env.IMAGE_PREFIX }}/advance-scoring:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-reference advance-reference=${{ env.IMAGE_PREFIX }}/advance-reference:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-notification advance-notification=${{ env.IMAGE_PREFIX }}/advance-notification:${SHA:0:7} -n advance-system
          kubectl set image deployment/advance-frontend advance-frontend=${{ env.IMAGE_PREFIX }}/advance-frontend:${SHA:0:7} -n advance-system

      - name: Wait for rollout
        run: |
          for svc in advance-gateway advance-identity advance-core advance-payment advance-scoring advance-reference advance-notification advance-frontend; do
            kubectl rollout status deployment/$svc -n advance-system --timeout=120s
          done

      - name: Apply ingress
        run: kubectl apply -f k8s/ingress.yaml
