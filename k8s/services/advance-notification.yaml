apiVersion: apps/v1
kind: Deployment
metadata:
  name: advance-notification
  namespace: advance-system
  labels:
    app: advance-notification
spec:
  replicas: 1
  selector:
    matchLabels:
      app: advance-notification
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: advance-notification
    spec:
      containers:
        - name: advance-notification
          image: ghcr.io/finuniversity/advance-notification:latest
          ports:
            - containerPort: 8086
          envFrom:
            - configMapRef:
                name: advance-config
            - secretRef:
                name: advance-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8086
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8086
            initialDelaySeconds: 60
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: advance-notification
  namespace: advance-system
spec:
  selector:
    app: advance-notification
  ports:
    - port: 8086
      targetPort: 8086
