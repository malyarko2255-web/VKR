apiVersion: apps/v1
kind: Deployment
metadata:
  name: advance-payment
  namespace: advance-system
  labels:
    app: advance-payment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: advance-payment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: advance-payment
    spec:
      containers:
        - name: advance-payment
          image: ghcr.io/finuniversity/advance-payment:latest
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: advance-config
            - secretRef:
                name: advance-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 30
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 10"]
---
apiVersion: v1
kind: Service
metadata:
  name: advance-payment
  namespace: advance-system
spec:
  selector:
    app: advance-payment
  ports:
    - port: 8083
      targetPort: 8083
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: advance-payment-hpa
  namespace: advance-system
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: advance-payment
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
