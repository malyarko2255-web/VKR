apiVersion: apps/v1
kind: Deployment
metadata:
  name: advance-frontend
  namespace: advance-system
  labels:
    app: advance-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: advance-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: advance-frontend
    spec:
      containers:
        - name: advance-frontend
          image: ghcr.io/finuniversity/advance-frontend:latest
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 20
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: advance-frontend
  namespace: advance-system
spec:
  selector:
    app: advance-frontend
  ports:
    - port: 80
      targetPort: 80
