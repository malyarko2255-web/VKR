apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: advance-ingress
  namespace: advance-system
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "60"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "60"
spec:
  tls:
    - hosts:
        - advance.company.ru
      secretName: advance-tls
  rules:
    - host: advance.company.ru
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: advance-gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: advance-frontend
                port:
                  number: 80
